version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: women_safety_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=women-safety-backend
      - APP_ENV=development
      - DEBUG=True
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/women_safety_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: women_safety_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=women_safety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: women_safety_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
